<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 538" width="980" role="img">
<title>The parts of NeoMillie</title>
<desc>The Pocket&#x27;s side, the console with its cartridge and the memory chips of the cartridge core, and what passes between them.</desc>
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#fbfaf7}.t{font-size:14px;font-weight:600;fill:#24231f}.s{font-size:12px;fill:#62605a}
.band{font-size:11.5px;font-weight:700;letter-spacing:.09em;fill:#62605a}
.box{stroke:#c9c6bc;stroke-width:1}.a{stroke:#85837c;stroke-width:1.4;fill:none}.ah{fill:#85837c}
.host{fill:#ececea}.cd{fill:#e3ecf8}.con{fill:#e3f1e5}.out{fill:#f7ead9}.mem{fill:#eee6f4}
@media (prefers-color-scheme:dark){
.bg{fill:#1c1b19}.t{fill:#ecebe6}.s,.band{fill:#a3a19a}.box{stroke:#4a4944}.a{stroke:#8f8d86}.ah{fill:#8f8d86}
.host{fill:#2c2c2a}.cd{fill:#22303f}.con{fill:#22362a}.out{fill:#3c3020}.mem{fill:#33283a}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" width="980" height="538"/>
<text class="band" x="14" y="24">THE POCKET</text>
<rect class="box host" x="14" y="34" width="308" height="78" rx="8"/><text class="t" x="27" y="58">SD card</text><text class="s" x="27" y="77">BIOS, a folder of ROM files</text><text class="s" x="27" y="93">per game, save files</text>
<rect class="box host" x="336" y="34" width="308" height="78" rx="8"/><text class="t" x="349" y="58">Pocket system</text><text class="s" x="349" y="77">reads files, shows the menu,</text><text class="s" x="349" y="93">writes saves on Quit</text>
<rect class="box host" x="658" y="34" width="308" height="78" rx="8"/><text class="t" x="671" y="58">Loader and settings</text><text class="s" x="671" y="77">the game&#x27;s entry says which</text><text class="s" x="671" y="93">file goes to which chip</text>
<path class="a" marker-end="url(#ah)" d="M322 73 L334 73"/>
<path class="a" marker-end="url(#ah)" d="M644 73 L656 73"/>
<text class="band" x="14" y="150">THE CONSOLE AND ITS CARTRIDGE</text>
<rect class="box con" x="14" y="160" width="147" height="108" rx="8"/><text class="t" x="27" y="184">68K processor</text><text class="s" x="27" y="203">runs the BIOS and</text><text class="s" x="27" y="219">the game, reads the</text><text class="s" x="27" y="235">buttons; 12, 16 or</text><text class="s" x="27" y="251">24 MHz by 68K Clock</text>
<rect class="box con" x="175" y="160" width="147" height="108" rx="8"/><text class="t" x="188" y="184">Cartridge chips</text><text class="s" x="188" y="203">bank switching and</text><text class="s" x="188" y="219">protection (SMA, PVC,</text><text class="s" x="188" y="235">CMC), as a game needs</text>
<rect class="box con" x="336" y="160" width="147" height="108" rx="8"/><text class="t" x="349" y="184">Video chip</text><text class="s" x="349" y="203">draws the sprites</text><text class="s" x="349" y="219">and the text layer,</text><text class="s" x="349" y="235">line by line</text>
<rect class="box out" x="497" y="160" width="147" height="108" rx="8"/><text class="t" x="510" y="184">Picture out</text><text class="s" x="510" y="203">304 or 320 wide,</text><text class="s" x="510" y="219">PAL, position and</text><text class="s" x="510" y="235">aspect ratio</text>
<rect class="box con" x="658" y="160" width="147" height="108" rx="8"/><text class="t" x="671" y="184">Sound</text><text class="s" x="671" y="203">Z80 and YM2610: FM,</text><text class="s" x="671" y="219">two kinds of samples,</text><text class="s" x="671" y="235">square waves</text>
<rect class="box out" x="819" y="160" width="147" height="108" rx="8"/><text class="t" x="832" y="184">Sound out</text><text class="s" x="832" y="203">Stereo Mix, Mute</text><text class="s" x="832" y="219">and ADPCM-A</text><text class="s" x="832" y="235">Channel act here</text>
<path class="a" marker-end="url(#ah)" d="M161 214 L173 214"/>
<path class="a" marker-end="url(#ah)" d="M483 214 L495 214"/>
<path class="a" marker-end="url(#ah)" d="M805 214 L817 214"/>
<text class="band" x="14" y="306">MEMORY</text>
<rect class="box mem" x="14" y="316" width="952" height="56" rx="8"/><text class="t" x="27" y="340">Memory arbiter</text><text class="s" x="27" y="359">gives each chip to one user at a time, in a fixed order of priority, so that the picture never waits</text>
<text class="band" x="14" y="410"></text>
<rect class="box mem" x="14" y="420" width="179" height="92" rx="8"/><text class="t" x="27" y="444">PSRAM 1, 16 MB</text><text class="s" x="27" y="463">the BIOS, the game&#x27;s</text><text class="s" x="27" y="479">program, MVS backup RAM</text>
<rect class="box mem" x="207" y="420" width="179" height="92" rx="8"/><text class="t" x="220" y="444">PSRAM 2, 16 MB</text><text class="s" x="220" y="463">sound samples</text>
<rect class="box mem" x="400" y="420" width="179" height="92" rx="8"/><text class="t" x="413" y="444">SDRAM, 64 MB</text><text class="s" x="413" y="463">sprites</text>
<rect class="box mem" x="594" y="420" width="179" height="92" rx="8"/><text class="t" x="607" y="444">SRAM, 256 KB</text><text class="s" x="607" y="463">the text layer and the</text><text class="s" x="607" y="479">Z80&#x27;s program, copied</text><text class="s" x="607" y="495">here after a load</text>
<rect class="box mem" x="787" y="420" width="179" height="92" rx="8"/><text class="t" x="800" y="444">Inside the FPGA</text><text class="s" x="800" y="463">the 68K&#x27;s work RAM,</text><text class="s" x="800" y="479">colours, the memory</text><text class="s" x="800" y="495">card, two read caches</text>
<path class="a" marker-end="url(#ah)" d="M88 268 L88 314"/>
<path class="a" marker-end="url(#ah)" d="M410 268 L410 314"/>
<path class="a" marker-end="url(#ah)" d="M732 268 L732 314"/>
<path class="a" marker-end="url(#ah)" d="M104 372 L104 418"/>
<path class="a" marker-end="url(#ah)" d="M297 372 L297 418"/>
<path class="a" marker-end="url(#ah)" d="M490 372 L490 418"/>
<path class="a" marker-end="url(#ah)" d="M683 372 L683 418"/>
<path class="a" marker-end="url(#ah)" d="M876 372 L876 418"/>
<path class="a" marker-end="url(#ah)" d="M812 112 L812 314"/>
<text class="s" x="805" y="132" text-anchor="end">the ROMs, before the game starts</text>
</svg>
