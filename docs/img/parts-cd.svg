<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 662" width="980" role="img">
<title>The parts of NeoMillieCD</title>
<desc>The Pocket&#x27;s side, the rebuilt CD drive, the console and the memory chips of the CD core, and what passes between them.</desc>
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#fbfaf7}.t{font-size:14px;font-weight:600;fill:#24231f}.s{font-size:12px;fill:#62605a}
.band{font-size:11.5px;font-weight:700;letter-spacing:.09em;fill:#62605a}
.box{stroke:#c9c6bc;stroke-width:1}.a{stroke:#85837c;stroke-width:1.4;fill:none}.ah{fill:#85837c}
.host{fill:#ececea}.cd{fill:#e3ecf8}.con{fill:#e3f1e5}.out{fill:#f7ead9}.mem{fill:#eee6f4}
@media (prefers-color-scheme:dark){
.bg{fill:#1c1b19}.t{fill:#ecebe6}.s,.band{fill:#a3a19a}.box{stroke:#4a4944}.a{stroke:#8f8d86}.ah{fill:#8f8d86}
.host{fill:#2c2c2a}.cd{fill:#22303f}.con{fill:#22362a}.out{fill:#3c3020}.mem{fill:#33283a}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" width="980" height="662"/>
<text class="band" x="14" y="24">THE POCKET</text>
<rect class="box host" x="14" y="34" width="308" height="78" rx="8"/><text class="t" x="27" y="58">SD card</text><text class="s" x="27" y="77">BIOS, disc (CUE and BIN),</text><text class="s" x="27" y="93">memory card file</text>
<rect class="box host" x="336" y="34" width="308" height="78" rx="8"/><text class="t" x="349" y="58">Pocket system</text><text class="s" x="349" y="77">reads files, shows the menu,</text><text class="s" x="349" y="93">writes saves on Quit</text>
<rect class="box host" x="658" y="34" width="308" height="78" rx="8"/><text class="t" x="671" y="58">Loader and settings</text><text class="s" x="671" y="77">takes the BIOS, and each</text><text class="s" x="671" y="93">menu item as a register</text>
<path class="a" marker-end="url(#ah)" d="M322 73 L334 73"/>
<path class="a" marker-end="url(#ah)" d="M644 73 L656 73"/>
<text class="band" x="14" y="150">THE CD DRIVE, REBUILT</text>
<rect class="box cd" x="14" y="160" width="228" height="92" rx="8"/><text class="t" x="27" y="184">Decoder</text><text class="s" x="27" y="203">offers each data sector to</text><text class="s" x="27" y="219">the 68K, which copies it</text><text class="s" x="27" y="235">into memory</text>
<rect class="box cd" x="256" y="160" width="228" height="92" rx="8"/><text class="t" x="268" y="184">Sector fetch</text><text class="s" x="268" y="203">reads sectors five ahead of</text><text class="s" x="268" y="219">the drive; with CD Turbo 4x,</text><text class="s" x="268" y="235">256 in a ring in SDRAM</text>
<rect class="box cd" x="497" y="160" width="228" height="92" rx="8"/><text class="t" x="510" y="184">Drive model</text><text class="s" x="510" y="203">seeks, plays and answers the</text><text class="s" x="510" y="219">BIOS; 1x or 2x by CD/CDZ,</text><text class="s" x="510" y="235">up to 4x by Turbo</text>
<rect class="box cd" x="738" y="160" width="228" height="92" rx="8"/><text class="t" x="752" y="184">Disc mount</text><text class="s" x="752" y="203">reads the CUE: the tracks,</text><text class="s" x="752" y="219">data or audio, and where</text><text class="s" x="752" y="235">each one starts</text>
<path class="a" marker-end="url(#ah)" d="M369 112 L369 158"/>
<text class="s" x="376" y="132" text-anchor="start">sectors</text>
<path class="a" marker-end="url(#ah)" d="M614 112 L614 122 L852 122 L852 158"/>
<text class="s" x="859" y="144" text-anchor="start">the CUE</text>
<path class="a" marker-end="url(#ah)" d="M738 206 L726 206"/>
<path class="a" marker-end="url(#ah)" d="M497 206 L485 206"/>
<path class="a" marker-end="url(#ah)" d="M256 206 L244 206"/>
<text class="band" x="14" y="290">THE CONSOLE</text>
<rect class="box con" x="14" y="300" width="179" height="92" rx="8"/><text class="t" x="27" y="324">68K processor</text><text class="s" x="27" y="343">runs the BIOS and the game,</text><text class="s" x="27" y="359">reads the buttons; 12, 16</text><text class="s" x="27" y="375">or 24 MHz by 68K Clock</text>
<rect class="box con" x="207" y="300" width="179" height="92" rx="8"/><text class="t" x="220" y="324">Video chip</text><text class="s" x="220" y="343">draws the sprites and the</text><text class="s" x="220" y="359">text layer, line by line</text>
<rect class="box out" x="400" y="300" width="179" height="92" rx="8"/><text class="t" x="413" y="324">Picture out</text><text class="s" x="413" y="343">304 or 320 wide, PAL,</text><text class="s" x="413" y="359">position, and the scaler&#x27;s</text><text class="s" x="413" y="375">aspect ratio</text>
<rect class="box con" x="594" y="300" width="179" height="92" rx="8"/><text class="t" x="607" y="324">Sound</text><text class="s" x="607" y="343">Z80 processor and YM2610:</text><text class="s" x="607" y="359">FM and samples, plus the</text><text class="s" x="607" y="375">disc&#x27;s music</text>
<rect class="box out" x="787" y="300" width="179" height="92" rx="8"/><text class="t" x="800" y="324">Sound out</text><text class="s" x="800" y="343">Stereo Mix, Mute and</text><text class="s" x="800" y="359">ADPCM-A Channel act</text><text class="s" x="800" y="375">here</text>
<path class="a" marker-end="url(#ah)" d="M104 252 L104 298"/>
<text class="s" x="111" y="272" text-anchor="start">program, graphics and samples</text>
<path class="a" marker-end="url(#ah)" d="M369 252 L369 266 L683 266 L683 298"/>
<text class="s" x="690" y="286" text-anchor="start">music</text>
<path class="a" marker-end="url(#ah)" d="M386 346 L398 346"/>
<path class="a" marker-end="url(#ah)" d="M773 346 L785 346"/>
<text class="band" x="14" y="430">MEMORY</text>
<rect class="box mem" x="14" y="440" width="952" height="56" rx="8"/><text class="t" x="27" y="464">Memory arbiter</text><text class="s" x="27" y="483">gives each chip to one user at a time, in a fixed order of priority, so that the picture never waits</text>
<text class="band" x="14" y="534"></text>
<rect class="box mem" x="14" y="544" width="179" height="92" rx="8"/><text class="t" x="27" y="568">PSRAM 1, 16 MB</text><text class="s" x="27" y="587">the BIOS and the</text><text class="s" x="27" y="603">game&#x27;s program</text>
<rect class="box mem" x="207" y="544" width="179" height="92" rx="8"/><text class="t" x="220" y="568">PSRAM 2, 16 MB</text><text class="s" x="220" y="587">sound samples</text>
<rect class="box mem" x="400" y="544" width="179" height="92" rx="8"/><text class="t" x="413" y="568">SDRAM, 64 MB</text><text class="s" x="413" y="587">sprites, and the</text><text class="s" x="413" y="603">Turbo ring</text>
<rect class="box mem" x="594" y="544" width="179" height="92" rx="8"/><text class="t" x="607" y="568">SRAM, 256 KB</text><text class="s" x="607" y="587">the text layer</text>
<rect class="box mem" x="787" y="544" width="179" height="92" rx="8"/><text class="t" x="800" y="568">Inside the FPGA</text><text class="s" x="800" y="587">the Z80&#x27;s program,</text><text class="s" x="800" y="603">colours, the memory</text><text class="s" x="800" y="619">card</text>
<path class="a" marker-end="url(#ah)" d="M104 392 L104 438"/>
<path class="a" marker-end="url(#ah)" d="M297 392 L297 438"/>
<path class="a" marker-end="url(#ah)" d="M683 392 L683 438"/>
<path class="a" marker-end="url(#ah)" d="M104 496 L104 542"/>
<path class="a" marker-end="url(#ah)" d="M297 496 L297 542"/>
<path class="a" marker-end="url(#ah)" d="M490 496 L490 542"/>
<path class="a" marker-end="url(#ah)" d="M683 496 L683 542"/>
<path class="a" marker-end="url(#ah)" d="M876 496 L876 542"/>
</svg>
