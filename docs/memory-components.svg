<line class="r" x1="24" x2="1312" y1="1216" y2="1216"/>
<text class="m" x="24" y="1238">AES and MVS are one core, NeoMillie. For memory the mode changes one thing: only MVS uses the backup RAM and SFIX.</text>
<text class="m" x="24" y="1258">S and M1 stay whole on CRAM0. After a load a copy engine moves part of them to the SRAM, depending on the size of the S ROM. SFIX always stays on CRAM0.</text>
